<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBC Admin</title>
<style>
:root{--bg:#F6F5FB;--card:#fff;--fg:#1B1530;--muted:#6B6585;--line:#E4E1EF;--acc:#5B3CC4;--acc-2:#EFEAFF;--ok:#15803D;--bad:#B91C1C;--warn:#B45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0B1E;--card:#1A1430;--fg:#F1EEFF;--muted:#A49CC4;--line:#2C2448;--acc:#A78BFA;--acc-2:#2A2050;--ok:#4ADE80;--bad:#FB7185;--warn:#FBBF24;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0}header h1 span{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;min-height:44px;border-radius:8px;color:var(--muted);font:600 14px inherit;cursor:pointer}
nav button.on{background:var(--acc-2);color:var(--acc)}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button.b,textarea{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.b{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;cursor:pointer}
button.b.q{background:var(--card);color:var(--fg);border-color:var(--line)}
button.b:disabled{opacity:.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{color:var(--muted);display:block}.kpi b{font-size:24px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--acc-2)}
.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:8px;background:var(--acc-2);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--acc)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:12.5px/1.45 ui-monospace,Consolas,monospace;max-height:420px;overflow:auto}
.login{max-width:380px;margin:12vh auto}
.login input{width:100%;margin:6px 0 12px}
.err{color:var(--bad);min-height:20px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--acc-2);color:var(--acc);font-size:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sk div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.sk .done{border-color:var(--ok)}.sk .open{border-color:var(--acc)}
.b,button.b,select,input:not([type=checkbox]):not([type=radio]){min-height:44px}
input[type=checkbox]{width:18px;height:18px}
.an-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg .b.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.an-group h3{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .of{display:block;color:var(--muted);font-size:12px;margin-top:2px}.kpi .def{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:6px}
.bar.q2 i{background:var(--ok)}
.an-st td{vertical-align:top}.an-st tr.sel{background:var(--acc-2)}.an-det>td{background:var(--bg);padding:14px}.an-d h3{margin:12px 0 6px;font-size:14px}
#an-q{min-width:220px}
.an-bar{padding:14px 18px}
.an-filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.an-filters label,.set-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.an-filters select{min-width:200px;max-width:340px}
.an-per .lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.an-lock{margin-top:8px}
.an-views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.an-views button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;min-height:44px;font-weight:600;font-size:14px;font-family:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
.an-views button.on{color:var(--acc);border-bottom-color:var(--acc)}
.an-note{margin:10px 0 0;font-size:12.5px}.an-note a{color:var(--acc)}
.an-scope{margin:0 0 4px}
.an-cmp td,.an-cmp th{white-space:nowrap}.an-cmp td.best{color:var(--ok);font-weight:700}
.an-cmp td:first-child,.an-cmp th:first-child{position:sticky;left:0;background:var(--card);min-width:210px;white-space:normal;z-index:1}
.an-cmp tfoot td{border-top:2px solid var(--line);font-weight:600}
.an-cmp .bar{margin-top:6px;height:5px}
button.th{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
@media (max-width:640px){.who{margin-left:0;flex-wrap:wrap}.who select,.an-filters select,.an-filters label{max-width:100%;min-width:0}}
.an-livek .kpi{text-align:left;font:inherit;color:inherit;cursor:pointer}.an-livek .kpi.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:1px;animation:lvp 2s ease-in-out infinite}
@keyframes lvp{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.an-livenote{margin:0;align-self:center}.an-unichips{gap:8px}.an-live td{white-space:nowrap}.an-live td:nth-child(3){white-space:normal;min-width:200px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.set-grid input{font-weight:400}
</style></head>
<body>
<div id="root"></div>
<script>
(function(){"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const dt=t=>t?new Date(+t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
async function api(method,url,body,raw){const r=await fetch(url,{method,credentials:"same-origin",headers:raw?{"content-type":"application/octet-stream"}:body?{"content-type":"application/json"}:{},body:raw?body:body?JSON.stringify(body):undefined});
 let j=null;try{j=await r.json()}catch(e){}if(r.status===401&&!url.endsWith("/login")){A=null;draw();throw new Error("Please log in.")}if(!r.ok)throw new Error((j&&j.error)||"Error "+r.status);return j}
let A=null,TAB="overview",UNI="",UNIS=[];
const isSuper=()=>A&&A.role==="super_admin";
function draw(){if(!A){$("#root").innerHTML=`<div class="card login"><h2>KBC admin</h2><form id="lf"><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><button class="b">Log in</button><p class="err" id="le"></p></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();try{const r=await api("POST","/api/admin/login",{email:$("#em").value,password:$("#pw").value});await me();if(r.mustChange){TAB="account"}draw()}catch(x){$("#le").textContent=x.message}};return}
 const tabs=[["overview","Overview"],["analytics","Analytics"],["students","Students"],["content","Question bank"],["feedback","Feedback"],["settings","Settings"],...(isSuper()?[["admins","Admins"]]:[]),["account","Account"]];
 $("#root").innerHTML=`<header><h1>Kaun Banega <span>Coder</span> · admin</h1><nav>${tabs.map(([k,n])=>`<button data-tab="${k}" class="${TAB===k?"on":""}">${n}</button>`).join("")}</nav>
 <div class="who">${A.university?`<span class="pill">${esc(A.university)}</span>`:`<select id="uni" aria-label="University shown"><option value="">All universities</option>${UNIS.map(u=>`<option ${u===UNI?"selected":""}>${esc(u)}</option>`).join("")}</select>`}<span>${esc(A.email)} · ${A.role==="super_admin"?"super admin":"admin"}</span><button class="b q" id="lo">Log out</button></div></header><main id="m"><p class="muted">Loading…</p></main>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;draw()});
 $("#lo").onclick=()=>api("POST","/api/admin/logout").finally(()=>{A=null;draw()});
 const u=$("#uni");if(u)u.onchange=()=>{UNI=u.value;draw()};
 ({overview,analytics,students,content,feedback,settings,admins,account})[TAB]().catch(e=>{$("#m").innerHTML=`<p class="bad">${esc(e.message)}</p>`})}
const uq=()=>UNI?"university="+encodeURIComponent(UNI):"";
async function me(){A=(await api("GET","/api/admin/me")).admin;const u=await api("GET","/api/admin/universities");UNIS=u.rows.map(r=>r.university).filter(Boolean)}

async function overview(){const d=await api("GET","/api/admin/analytics?"+uq()),u=await api("GET","/api/admin/universities");
 const T=d.totals,maxDay=Math.max(1,...d.byDay.map(x=>x.n));
 $("#m").innerHTML=`<div class="kpis"><div class="kpi"><small>Students on the list</small><b>${d.students.n}</b></div><div class="kpi"><small>Logged in at least once</small><b>${d.students.logged_in}</b></div><div class="kpi"><small>Played</small><b>${T.players}</b></div><div class="kpi"><small>Answers</small><b>${T.attempts}</b></div><div class="kpi"><small>Accuracy</small><b>${pct(T.correct,T.attempts)}</b></div></div>
 <div class="row" style="margin-bottom:12px"><a class="b q" style="text-decoration:none" href="/api/admin/export/students.csv?${uq()}">Download students CSV</a><a class="b q" style="text-decoration:none" href="/api/admin/export/attempts.csv?${uq()}">Download all answers CSV</a></div>
 <div class="grid2"><div class="card"><h2>Answers per day (last 30 days, IST)</h2>${d.byDay.length?`<table>${d.byDay.map(x=>`<tr><td>${x.day}</td><td style="width:60%"><div class="bar"><i style="width:${x.n/maxDay*100}%"></i></div></td><td>${x.n}</td><td class="muted">${x.players} players</td></tr>`).join("")}</table>`:'<p class="muted">No answers yet.</p>'}</div>
 <div class="card"><h2>Accuracy by question type</h2><div class="tw"><table><tr><th>Level</th><th>Type</th><th>Answers</th><th>Right</th></tr>${d.byType.map(x=>`<tr><td>L${x.level}</td><td>${esc(x.type)}</td><td>${x.n}</td><td>${pct(x.right,x.n)}</td></tr>`).join("")||'<tr><td colspan=4 class="muted">No answers yet.</td></tr>'}</table></div></div></div>
 ${d.byUni.length?`<div class="card"><h2>By university</h2><div class="tw"><table><tr><th>University</th><th>Students</th><th>Logged in</th><th>Players</th><th>Answers</th><th>Accuracy</th></tr>${u.rows.map(r=>{const x=d.byUni.find(b=>b.university===r.university)||{};return `<tr><td>${esc(r.university||"(none)")}</td><td>${r.active}</td><td>${r.logged_in}</td><td>${x.players||0}</td><td>${x.n||0}</td><td>${pct(x.right||0,x.n||0)}</td></tr>`}).join("")}</table></div></div>`:""}
 <div class="card"><h2>Skill progress</h2><p class="muted">How many students have each skill open (by current level) or done.</p><div class="tw"><table><tr><th>Skill</th><th>Group</th><th>Open: L1</th><th>L2</th><th>L3</th><th>L4</th><th>Done</th></tr>${d.skills.filter(s=>s.open||s.done).map(s=>`<tr><td>${s.id} ${esc(s.name)}</td><td>${s.group}</td>${s.levels.map(n=>`<td>${n}</td>`).join("")}<td class="ok">${s.done}</td></tr>`).join("")||'<tr><td colspan=7 class="muted">No progress yet.</td></tr>'}</table></div></div>`}


/* ================= Analytics tab =================
   One filter bar (University, Batch, Period tabs or a custom From/To) drives three views: Overview, Compare universities, Students.
   Every choice comes from the database; test data (Admin > Settings) is always left out on the server. */
let AP={view:"overview",days:30,from:"",to:"",batch:"",sort:"recent",q:"",open:null,cmpSort:"students",cmpDir:-1},AF=null;
const fmtMs=ms=>{if(ms==null)return "—";ms=+ms;if(!ms)return "0";if(ms<1000)return Math.round(ms)+" ms";const s=Math.round(ms/1000);if(s<60)return s+" s";const m=Math.round(s/60);if(m<60)return m+" min";const h=Math.floor(m/60);return h+" h "+(m%60)+" min"};
const fmtV=m=>m.value==null?'<span class="muted">—</span>':m.unit==="pct"?m.value+"%":m.unit==="ms"?fmtMs(m.value):m.unit==="stars"?m.value+" ★":typeof m.value==="number"?m.value.toLocaleString("en-IN"):esc(m.value);
const ofTxt=m=>m.of!=null&&m.value!=null&&typeof m.value==="number"?`<small class="of">${pct(m.value,m.of)} of ${m.of.toLocaleString("en-IN")}</small>`:m.basis!=null?`<small class="of">based on ${m.basis}</small>`:"";
// the query string for the current filters; withUni=false for the comparison (it always shows every university you can see)
function aq(withUni=true){const p=new URLSearchParams();
 if(AP.days==="custom"){if(AP.from)p.set("from",AP.from);if(AP.to)p.set("to",AP.to)}else p.set("days",AP.days);
 if(AP.batch)p.set("batch",AP.batch);if(withUni&&UNI)p.set("university",UNI);return p.toString()}
async function analytics(){
 $("#m").innerHTML='<p class="muted">Loading analytics…</p>';
 AF=await api("GET","/api/admin/stats/filters?"+uq());
 if(AP.batch&&!AF.batches.some(b=>b.name===AP.batch))AP.batch="";
 if(AF.lockedUniversity&&AP.view==="compare")AP.view="overview";
 const per=[[1,"Today"],[7,"7 days"],[30,"30 days"],[90,"90 days"],[3650,"All time"],["custom","Custom"]];
 const views=[["live","Live now"],["overview","Overview"],...(AF.lockedUniversity?[]:[["compare","Compare universities"]]),["students","Students"]];
 const today=new Date(Date.now()+5.5*36e5).toISOString().slice(0,10);
 $("#m").innerHTML=`<div class="card an-bar">
  <div class="an-filters">
   <label>University${AF.lockedUniversity?`<span class="pill an-lock">${esc(AF.lockedUniversity)}</span>`:`<select id="af-uni"><option value="">All universities</option>${AF.universities.map(u=>`<option value="${esc(u.name)}" ${u.name===UNI?"selected":""}>${esc(u.name)} (${u.n.toLocaleString("en-IN")})</option>`).join("")}</select>`}</label>
   <label>Batch<select id="af-batch" ${AF.batches.length?"":"disabled"}><option value="">${AF.batches.length?"All batches":"No batches on the list"}</option>${AF.batches.map(b=>`<option value="${esc(b.name)}" ${b.name===AP.batch?"selected":""}>${esc(b.name)} (${b.n.toLocaleString("en-IN")})</option>`).join("")}</select></label>
   ${AP.view==="live"?`<p class="muted an-livenote"><span class="dot"></span> Live view refreshes every 15 seconds. The period doesn't apply here.</p>`:`<div class="an-per"><span class="lbl">Period</span><div class="seg" role="tablist" aria-label="Period">${per.map(([n,l])=>`<button class="b q ${AP.days===n?"on":""}" role="tab" aria-selected="${AP.days===n}" data-days="${n}">${l}</button>`).join("")}</div></div>
   ${AP.days==="custom"?`<label>From<input type="date" id="af-from" max="${today}" value="${esc(AP.from)}"></label><label>To<input type="date" id="af-to" max="${today}" value="${esc(AP.to||today)}"></label>`:""}`}
  </div>
  <div class="an-views" role="tablist" aria-label="Analytics view">${views.map(([k,l])=>`<button role="tab" aria-selected="${AP.view===k}" class="${AP.view===k?"on":""}" data-view="${k}">${l}</button>`).join("")}</div>
  <p class="muted an-note">Test data is left out (${esc([...AF.rules.rollPrefixes.map(p=>"IDs starting "+p),...AF.rules.universities,...AF.rules.batches.map(b=>"batch "+b)].join(", ")||"no rules set")}). Change it in <a href="#" id="af-set">Settings</a>.</p>
 </div><div id="an-body"><p class="muted">Loading…</p></div>`;
 const reload=()=>{AP.open=null;analytics()};
 const u=$("#af-uni");if(u)u.onchange=()=>{UNI=u.value;const h=$("#uni");if(h)h.value=UNI;reload()};
 $("#af-batch").onchange=e=>{AP.batch=e.target.value;reload()};
 document.querySelectorAll("[data-days]").forEach(b=>b.onclick=()=>{const v=b.dataset.days;AP.days=v==="custom"?"custom":+v;if(v==="custom"&&!AP.from){AP.to=today;AP.from=new Date(Date.now()+5.5*36e5-29*864e5).toISOString().slice(0,10)}reload()});
 const fr=$("#af-from"),to=$("#af-to");if(fr){fr.onchange=()=>{AP.from=fr.value;reload()};to.onchange=()=>{AP.to=to.value;reload()}}
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{AP.view=b.dataset.view;reload()});
 $("#af-set").onclick=e=>{e.preventDefault();TAB="settings";draw()};
 await ({live:anLive,overview:anOverview,compare:anCompare,students:anStudents})[AP.view]()}

/* Live now: who has the game open this minute and what they are doing. Refreshes every 15 s while the view is open. */
const ago=t=>{if(!t)return "—";const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?s+" s ago":s<3600?Math.floor(s/60)+" min ago":Math.floor(s/3600)+" h ago"};
const dur=t=>{if(!t)return "—";const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"just now":m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"};
const MODE={hotseat:["Hot seat","ok"],practice:["Practice","warn"],browsing:["Browsing","muted"],unknown:["On the portal","muted"]};
async function anLive(){const box=$("#an-body");if(!box)return;
 clearTimeout(AP.liveT);
 const d=await api("GET","/api/admin/stats/live?"+aq());
 if(TAB!=="analytics"||AP.view!=="live"||!$("#an-body"))return;
 const S=d.summary,f=AP.liveF||"all",rows=d.rows.filter(r=>f==="all"||r.mode===f||(f==="browsing"&&r.mode==="unknown"));
 const doing=r=>r.question&&(r.mode==="hotseat"||r.mode==="practice")?`${esc(r.doing)}${r.mode==="practice"?" (practice)":""}<br><small class="muted">${esc(r.question.skill)} ${esc(r.question.name)} · L${r.question.level} ${esc(r.question.type)}${r.answeredThisGame?` · ${r.answeredThisGame} answered this game`:""}</small>`:esc(r.doing);
 box.innerHTML=`<div class="kpis an-livek">
  <button class="kpi ${f==="all"?"on":""}" data-lf="all"><small><span class="dot"></span> On the portal now</small><b>${S.live.toLocaleString("en-IN")}</b><span class="of">seen in the last ${Math.round(d.liveMs/1000)} s</span></button>
  <button class="kpi ${f==="hotseat"?"on":""}" data-lf="hotseat"><small>In the hot seat</small><b>${S.hotseat}</b><span class="of">Fastest Finger or answering</span></button>
  <button class="kpi ${f==="practice"?"on":""}" data-lf="practice"><small>Practising</small><b>${S.practice}</b></button>
  <button class="kpi ${f==="browsing"?"on":""}" data-lf="browsing"><small>Browsing</small><b>${S.browsing}</b><span class="of">home, path, Hall of Fame…</span></button>
  <div class="kpi"><small>Left in the last 15 min</small><b>${S.leftRecently}</b></div>
 </div>
 ${d.byUniversity.length>1?`<div class="card"><h2>Live by university</h2><div class="row an-unichips">${d.byUniversity.map(u=>`<span class="pill">${esc(u.university)} · <b>${u.n}</b></span>`).join("")}</div></div>`:""}
 <div class="card"><div class="an-head"><div><h2 style="margin:0">Students on the portal now${f!=="all"?" · "+esc(MODE[f][0]):""}</h2><p class="muted" style="margin:4px 0 0">${rows.length} shown · updated ${new Date(d.at).toLocaleTimeString("en-IN")}</p></div><button class="b q" id="lv-r">Refresh</button></div>
 <div class="tw"><table class="an-live"><tr><th>Student</th><th>University · batch</th><th>Doing now</th><th>Mode</th><th>Online for</th><th>Today</th><th>Now at</th><th>Last ping</th></tr>
 ${rows.map(r=>`<tr><td><b>${esc(r.name||"—")}</b><br><small class="muted">${esc(r.roll_no)}</small></td><td class="muted">${esc(r.university)}${r.batch?`<br><small>${esc(r.batch)}</small>`:""}</td><td>${doing(r)}</td><td><span class="${MODE[r.mode][1]}">${MODE[r.mode][0]}</span></td><td>${dur(r.since)}</td><td>${r.todayAnswers} Q${r.todayAcc!=null?` · ${r.todayAcc}%`:""}<br><small class="muted">${fmtMs(r.todayMs)} on portal</small></td><td>${r.nowAt?`${esc(r.nowAt.id)} · L${r.nowAt.level}`:'<span class="muted">—</span>'}</td><td class="muted">${ago(r.lastSeen)}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">${S.live?"No one in this group right now.":"No students on the portal right now."}</td></tr>`}</table></div></div>

 <div class="row">${isSuper()?`<button class="b q" id="sact">${s.active?"Deactivate":"Activate"}</button><button class="b q" id="sreset">Reset progress</button>`:""}</div></div>
 <p class="muted">Now on: <b>${E.active?`${E.active} L${E.skills[E.active].level} R${E.skills[E.active].r}`:E.allDone?"all done":"waiting for content"}</b> · ${E.right}/${E.q} right · last login ${dt(s.last_login_at)} · wallet ${d.progress?d.progress.coins:0}</p>
 <div class="sk">${Object.entries(E.skills).filter(([k,v])=>v.status!=="locked").map(([k,v])=>`<div class="${v.status}"><b>${k}</b> ${v.status==="done"?"done":`L${v.level} R${v.r}`}<br><span class="muted">${v.right}/${v.q} right${v.content==="none"?" · no questions yet":""}</span></div>`).join("")}</div>
 <div class="grid2" style="margin-top:14px"><div><h2>Answers (latest 500)</h2><div class="tw"><table><tr><th>When</th><th>Question</th><th>Type</th><th>Mode</th><th>Result</th><th>Time</th></tr>${d.attempts.map(a=>`<tr><td>${dt(a.at)}</td><td>${esc(a.question_id)}</td><td>${esc(a.type)}</td><td>${a.mode}</td><td class="${a.correct?"ok":"bad"}">${a.correct?"right":a.timeout?"timeout":"wrong"}</td><td>${Math.round((a.ms||0)/1000)}s</td></tr>`).join("")}</table></div></div>
 <div><h2>Progression history</h2><div class="tw"><table><tr><th>When</th><th>Skill</th><th>Event</th><th>Detail</th></tr>${d.transitions.map(t=>`<tr><td>${dt(t.at)}</td><td>${t.skill}</td><td>${t.kind.replace("_"," ")}</td><td class="muted">${esc(JSON.stringify(t.detail||{}))}</td></tr>`).join("")}</table></div></div></div></div>`;
 if($("#sact"))$("#sact").onclick=async()=>{await api("POST",`/api/admin/students/${encodeURIComponent(roll)}/active`,{active:!s.active});detail(roll)};
 if($("#sreset"))$("#sreset").onclick=async()=>{if(!confirm(`Reset all progress of ${roll}? Their answer history is kept.`))return;await api("POST",`/api/admin/students/${encodeURIComponent(roll)}/reset`);detail(roll)};
 $("#sd").scrollIntoView({behavior:"smooth"})}

/* one readable line per upload instead of the raw counts */
function upSummary(u){const c=u.counts||{};
 if(u.kind==="graph")return c.activated?`Made live again: ${c.groups} groups, ${c.skills} skills`:`${c.groups} groups, ${c.skills} skills`+(c.diff?` · +${c.diff.added.length} / −${c.diff.removed.length} skills`:"");
 if(u.kind==="bank")return `${(c.valid||0).toLocaleString("en-IN")} of ${(c.received||0).toLocaleString("en-IN")} valid · ${c.inserted||0} added, ${c.updated||0} updated`;
 if(u.kind==="students")return `${c.rows||0} rows · ${c.added||0} added, ${c.updated||0} updated, ${c.deactivated||0} deactivated`;
 return Object.entries(c).map(([k,v])=>k+" "+(typeof v==="object"?"…":v)).join(", ")}
async function content(){const d=await api("GET","/api/admin/content"),G=d.graph;
 const bySkill={};d.counts.forEach(c=>{(bySkill[c.skill]=bySkill[c.skill]||{n:0,types:{}}).n+=c.n;bySkill[c.skill].types[c.type]=c.n});
 $("#m").innerHTML=`<div class="kpis"><div class="kpi"><small>Live questions</small><b>${d.total}</b></div><div class="kpi"><small>Skills with questions</small><b>${Object.keys(bySkill).length} / ${G.skills.length}</b></div><div class="kpi"><small>Question types</small><b>${G.types.length}</b></div><div class="kpi"><small>Skill graph</small><b style="font-size:14px">${esc(G.version)}</b></div></div>
 ${isSuper()?`<div class="card"><h2>Upload a question bundle</h2><p class="muted">JSON in the bank format: <code>{"bank_version": "…", "questions": [ … ]}</code>. Questions are checked against question-types.json and the skill graph, then added or updated by id. Check first, then upload.</p>
 <div class="row"><input type="file" id="bf" aria-label="Question bundle file (.json)" accept=".json"><button class="b q" id="bchk">Check</button><button class="b" id="bup">Upload</button></div><div id="bres"></div></div>
 <div class="card"><h2>Replace the skill graph</h2><p class="muted">Upload the <b>CT Skill Graph .html</b> export as it is, or a skill-graph.json. The new graph goes live for every student at once and their path changes with it: skills they finished stay finished, skills they started stay open, new skills join the path, and skills you remove drop off it (their history is kept). Starter skills count as done from the start. There is one prize per skill group. Check first, then upload.</p><div class="row"><input type="file" id="gf" aria-label="Skill graph file (.html or .json)" accept=".html,.htm,.json"><button class="b q" id="gchk">Check</button><button class="b" id="gup">Upload graph</button></div>
 <label class="row" style="gap:8px;margin-top:10px;font-weight:600"><input type="checkbox" id="gfresh"> Start every student from the beginning with this graph (wallets, prizes and paths are cleared; answer history is kept)</label>
 <div id="gres"></div><div id="ghist"></div>
 <div style="margin-top:22px;padding-top:14px;border-top:1px solid var(--line)"><h3 style="margin:0 0 6px">Fresh start for everyone</h3><p class="muted" style="margin:0 0 10px">Every student starts again from the first topic, with an empty wallet, on the graph that is live now. Their answer history stays in the database for reports. This can't be undone.</p><button class="b" id="greset" style="background:var(--bad,#c0392b)">Start everyone from the beginning…</button><p id="gresetr"></p></div></div>`:""}
 <div class="card"><h2>Coverage by skill</h2><div class="tw"><table><tr><th>Skill</th><th>Name</th><th>Group</th><th>Questions</th><th>Types</th></tr>${G.skills.map(s=>{const c=bySkill[s.id];return `<tr class="${c?"click":""}" ${c?`data-sk="${s.id}"`:""}><td>${s.id}</td><td>${esc(s.name)}</td><td>${s.group}</td><td>${c?c.n:'<span class="muted">0</span>'}</td><td class="muted">${c?Object.keys(c.types).length+" of 29":""}</td></tr>`}).join("")}</table></div></div>
 <div id="ql"></div>
 <div class="card"><h2>Recent uploads</h2><div class="tw"><table><tr><th>When</th><th>Kind</th><th>File</th><th>Result</th></tr>${d.uploads.map(u=>`<tr><td>${dt(u.at)}</td><td>${u.kind}</td><td>${esc(u.file_name)}</td><td class="muted">${esc(upSummary(u))}</td></tr>`).join("")}</table></div></div>`;
 document.querySelectorAll("tr[data-sk]").forEach(tr=>tr.onclick=()=>qlist(tr.dataset.sk));
 /* Vercel refuses request bodies over 4.5 MB, so a bank is sent in parts of about 2 MB (only its questions; any graph or
    metadata in the file is left out). Each part is checked and upserted by id on its own; the results are added up here. */
 const send=async dry=>{const f=$("#bf").files[0];if(!f)return;const out=$("#bres");
  const bar=t=>out.innerHTML=`<p class="muted">${t}</p>`;bar("Reading the file…");
  try{const body=JSON.parse(await f.text());
   const list=Array.isArray(body)?body:Array.isArray(body&&body.questions)?body.questions:body&&body.id?[body]:null;
   if(!list){out.innerHTML='<p class="bad">Expected {"questions": [ … ]} in the file.</p>';return}
   const bv=Array.isArray(body)?null:body.bank_version||null,parts=[];let cur=[],size=0;
   for(const q of list){const n=JSON.stringify(q).length;if(cur.length&&(size+n>2e6||cur.length>=2000)){parts.push(cur);cur=[];size=0}cur.push(q);size+=n}
   if(cur.length)parts.push(cur);
   const seen=new Set(),dup=[];list.forEach(q=>{if(q&&q.id){if(seen.has(q.id))dup.push({id:q.id,errors:["duplicate id in this file"]});seen.add(q.id)}});
   const tot={received:0,valid:0,invalid:0,inserted:0,updated:0},errs=dup.slice();
   for(let i=0;i<parts.length;i++){
    bar(`${dry?"Checking":"Uploading"} part ${i+1} of ${parts.length} · ${tot.received.toLocaleString("en-IN")} of ${list.length.toLocaleString("en-IN")} questions done…`);
    const name=f.name+(parts.length>1?` (part ${i+1}/${parts.length})`:"");
    const r=await api("POST",`/api/admin/bank/upload?name=${encodeURIComponent(name)}${dry?"&dry=1":""}`,{bank_version:bv,questions:parts[i]});
    for(const k in tot)tot[k]+=r.counts[k]||0;errs.push(...r.errors)}
   tot.invalid=Math.max(tot.invalid,0);
   out.innerHTML=`<p class="${errs.length?"warn":"ok"}">${tot.valid.toLocaleString("en-IN")} of ${tot.received.toLocaleString("en-IN")} questions valid${parts.length>1?` (sent in ${parts.length} parts)`:""}.${dry?"":` ${tot.inserted.toLocaleString("en-IN")} added, ${tot.updated.toLocaleString("en-IN")} updated.`}${dup.length?` ${dup.length} ids appear twice in the file.`:""}</p>${errs.length?`<pre>${esc(errs.slice(0,100).map(e=>`${e.id||"?"}: ${e.errors.join("; ")}`).join("\n"))}${errs.length>100?`\n… and ${errs.length-100} more`:""}</pre>`:""}`;
   if(!dry)setTimeout(content,1500)}
  catch(e){out.innerHTML=`<p class="bad">${esc(e.message)}</p>`}};
 if($("#bchk")){$("#bchk").onclick=()=>send(true);$("#bup").onclick=()=>send(false)}
 const ids=a=>a.length?esc(a.slice(0,30).join(", "))+(a.length>30?` and ${a.length-30} more`:""):'<span class="muted">none</span>';
 const diffHTML=(d,im)=>`<table><tr><td>Skills added</td><td>${ids(d.added)}</td></tr><tr><td>Skills removed</td><td>${ids(d.removed)}</td></tr><tr><td>Prerequisites changed</td><td>${ids(d.reqChanged)}</td></tr><tr><td>Moved to another group</td><td>${ids(d.moved)}</td></tr><tr><td>rmax changed</td><td>${ids(d.rmaxChanged)}</td></tr><tr><td>Renamed</td><td>${ids(d.renamed)}</td></tr><tr><td>Skill groups (prizes)</td><td>${d.groups.before} → ${d.groups.after} (${d.rungs.before} → ${d.rungs.after} prizes)</td></tr>${im?`<tr><td>Students with progress on changed or removed skills</td><td>${im.students}</td></tr><tr><td>Live questions left without a skill</td><td>${im.orphanQuestions?`<span class="warn">${im.orphanQuestions} (${esc(im.orphanSkills.join(", "))}): students won't be served these</span>`:"0"}</td></tr>`:""}</table>`;
 const gsend=async dry=>{const f=$("#gf").files[0];if(!f)return;$("#gres").innerHTML='<p class="muted">Working…</p>';
  try{const text=await f.text(),html=/\.html?$/i.test(f.name)||/^\s*</.test(text);
   const fresh=!dry&&$("#gfresh").checked;
   if(fresh&&!confirm("Upload this graph AND start every student from the beginning? Wallets, prizes and paths are cleared. This can't be undone."))return $("#gres").innerHTML="";
   const r=await api("POST",`/api/admin/graph/upload?name=${encodeURIComponent(f.name)}${dry?"&dry=1":""}${fresh?"&fresh=1":""}`,html?{html:text}:JSON.parse(text));
   const cv=r.converted?`<p class="muted">Read from the HTML export: ${r.converted.checkpoints} checkpoints, ${r.converted.groups} groups, ${r.converted.skills} skills${r.converted.starters.length?`; starter skills (done from the start): ${esc(r.converted.starters.join(", "))}`:""}.</p>`:"";
   $("#gres").innerHTML=dry?`<p class="ok">The graph is valid. If you upload it:</p>${cv}${diffHTML(r.diff,r.impact)}`:`<p class="ok">Graph ${esc(r.version)} is live. Students see the new path on their next question or the next time they open the game.${r.fresh?` Every student (${r.fresh.students} with progress) starts from the beginning.`:""}</p>${cv}${diffHTML(r.diff)}`;
   if(!dry)setTimeout(content,2500)}
  catch(e){$("#gres").innerHTML=`<pre class="bad">${esc(e.message)}</pre>`}};
 if($("#gup")){$("#gchk").onclick=()=>gsend(true);$("#gup").onclick=()=>gsend(false);ghist()}
 if($("#greset"))$("#greset").onclick=async()=>{const t=prompt("This starts EVERY student from the beginning: paths, wallets and prizes are cleared (answer history is kept).\n\nType RESET to confirm.");if(t!=="RESET")return;
  try{const r=await api("POST","/api/admin/progress/reset",{confirm:"RESET"});$("#gresetr").innerHTML=`<span class="ok">Done. ${r.students} students with progress start again from the first topic.</span>`}catch(e){$("#gresetr").innerHTML=`<span class="bad">${esc(e.message)}</span>`}}}
async function ghist(){const r=await api("GET","/api/admin/graph/history");if(!$("#ghist"))return;
 $("#ghist").innerHTML=`<h3 style="margin-top:18px">Graph versions</h3><table><tr><th>Version</th><th>Uploaded</th><th>Groups</th><th>Skills</th><th></th></tr>${r.rows.map(g=>`<tr><td>${esc(g.version)}</td><td>${dt(g.at)}</td><td>${g.groups}</td><td>${g.skills}</td><td>${g.active?'<b class="ok">Live</b>':`<button class="b q" data-gact="${esc(g.version)}">Make live again</button>`}</td></tr>`).join("")}</table>`;
 document.querySelectorAll("[data-gact]").forEach(b=>b.onclick=async()=>{if(!confirm(`Make ${b.dataset.gact} the live skill graph again? Every student's path switches to it.`))return;
  try{await api("POST","/api/admin/graph/activate",{version:b.dataset.gact});content()}catch(e){alert(e.message)}})}
async function qlist(sk){const r=await api("GET","/api/admin/questions?skill="+sk);
 $("#ql").innerHTML=`<div class="card"><h2>${sk} questions</h2><div class="tw"><table><tr><th>Id</th><th>Type</th><th>Status</th><th>Task</th></tr>${r.rows.map(q=>`<tr class="click" data-q="${esc(q.id)}"><td>${esc(q.id)}</td><td>${esc(q.type)}</td><td>${q.status}</td><td>${esc((q.task||"").slice(0,110))}</td></tr>`).join("")}</table></div><div id="qd"></div></div>`;
 document.querySelectorAll("tr[data-q]").forEach(tr=>tr.onclick=()=>qdetail(tr.dataset.q));$("#ql").scrollIntoView({behavior:"smooth"})}
async function qdetail(id){const d=await api("GET","/api/admin/questions/"+encodeURIComponent(id));
 $("#qd").innerHTML=`<h2 style="margin-top:14px">${esc(id)} <span class="pill">${d.status}</span> <span class="muted">${d.stats.n} answers, ${pct(d.stats.right||0,d.stats.n)} right</span></h2>
 ${isSuper()?`<div class="row">${["live","draft","archived"].filter(s=>s!==d.status).map(s=>`<button class="b q" data-st="${s}">Mark ${s}</button>`).join("")}</div>`:""}
 <div class="grid2"><div><h2>What students see</h2><pre>${esc(JSON.stringify(d.preview,null,2))}</pre></div><div><h2>Stored question (with key)</h2><pre>${esc(JSON.stringify(d.question,null,2))}</pre></div></div>`;
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{await api("POST",`/api/admin/questions/${encodeURIComponent(id)}/status`,{status:b.dataset.st});qdetail(id)})}

async function feedback(){const r=await api("GET","/api/admin/feedback?"+uq());
 $("#m").innerHTML=`<div class="card"><h2>Feedback</h2><div class="tw"><table><tr><th>When</th><th>Student</th><th>University</th><th>Rating</th><th>Feedback</th><th>Asked</th></tr>${r.rows.map(f=>{let c=f.ctx;if(typeof c==="string"){try{c=JSON.parse(c)}catch(e){c=null}}c=c||{};const st=Number(c.stars)||0,bx=Math.min(6,Number(c.bonus)||0);
  return `<tr><td>${dt(f.at)}</td><td>${esc(f.roll_no)} ${esc(f.name||"")}</td><td>${esc(f.university||"")}</td><td style="white-space:nowrap;color:#B45309">${st?"★".repeat(st)+"☆".repeat(5-st):"–"}${bx?`<br><span style="color:#7C3AED" title="Optional extra stars beyond 5">+${bx} extra ${"★".repeat(bx)}</span>`:""}</td><td>${Array.isArray(c.tags)&&c.tags.length?`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px">${c.tags.map(t=>`<span style="padding:1px 8px;border-radius:999px;border:1px solid #CBD5E1;font-size:12px">${esc(t)}</span>`).join("")}</div>`:""}${esc(f.text)||(c.tags&&c.tags.length?"":'<span class="muted">Rating only</span>')}</td><td class="muted">${c.kind==="question"?"Question rating"+(c.qid?" · "+esc(c.qid):"")+(c.correct!=null?(c.correct?" · answered right":" · answered wrong"):""):c.kind==="game"?"End of game":""}${c.kind==="question"||c.kind==="game"?"<br>":""}${esc(c.trigger||"feedback button")}${c.screen?" · "+esc(c.screen):""}</td></tr>`}).join("")||'<tr><td colspan=6 class="muted">Nothing yet.</td></tr>'}</table></div></div>`}
async function admins(){const r=await api("GET","/api/admin/admins");
 $("#m").innerHTML=`<div class="card"><h2>Admins</h2><table><tr><th>Email</th><th>Name</th><th>Role</th><th>University</th><th>Last login</th></tr>${r.rows.map(a=>`<tr><td>${esc(a.email)}</td><td>${esc(a.name)}</td><td>${a.role}</td><td>${esc(a.university||"all")}</td><td>${dt(a.last_login_at)}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>Add or reset an admin</h2><p class="muted">A university admin sees only that university's students and numbers. They get a temporary password to change at first login.</p>
 <div class="row"><input id="ne" aria-label="New admin email" type="email" placeholder="Email"><input id="nn" aria-label="New admin name" placeholder="Name"><select id="nr" aria-label="New admin role"><option value="admin">Admin</option><option value="super_admin">Super admin</option></select><select id="nu" aria-label="New admin university"><option value="">All universities</option>${UNIS.map(u=>`<option>${esc(u)}</option>`).join("")}</select><button class="b" id="nadd">Save</button></div><p id="nres"></p></div>`;
 $("#nadd").onclick=async()=>{try{const x=await api("POST","/api/admin/admins",{email:$("#ne").value,name:$("#nn").value,role:$("#nr").value,university:$("#nu").value});$("#nres").innerHTML=`<span class="ok">Saved.</span> Temporary password for ${esc(x.email)}: <code>${esc(x.tempPassword)}</code> (shown once)`}catch(e){$("#nres").innerHTML=`<span class="bad">${esc(e.message)}</span>`}}}
async function account(){$("#m").innerHTML=`<div class="card" style="max-width:420px"><h2>Change your password</h2>${A.must_change_pw?'<p class="warn">Please replace your temporary password.</p>':""}<input id="cp" aria-label="Current password" type="password" placeholder="Current password" style="width:100%;margin-bottom:8px"><input id="np" aria-label="New password" type="password" placeholder="New password (10+ characters)" style="width:100%;margin-bottom:8px"><button class="b" id="cpb">Change</button><p id="cpr"></p></div>`;
 $("#cpb").onclick=async()=>{try{await api("POST","/api/admin/password",{current:$("#cp").value,next:$("#np").value});A.must_change_pw=0;$("#cpr").innerHTML='<span class="ok">Password changed.</span>'}catch(e){$("#cpr").innerHTML=`<span class="bad">${esc(e.message)}</span>`}}}
me().catch(()=>{A=null}).finally(draw);
})();
</script>
</body></html>
