<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Kaun Banega Coder</title>

<script>
/* Start the slow parts at once, in parallel with the styles and three.js: the player's data, and the mascot images
   saved by an earlier visit (bank-ui.js waits for both before it starts the game). */
window.__kbcBoot=fetch("/api/boot",{credentials:"same-origin"});
window.__kbcM3D=new Promise(function(res){var done=function(v){res(v||{})};setTimeout(done,1500);
 try{var o=indexedDB.open("kbc-cache",1);o.onupgradeneeded=function(){o.result.createObjectStore("m3d")};o.onerror=function(){done()};
  o.onsuccess=function(){try{var out={},c=o.result.transaction("m3d","readonly").objectStore("m3d").openCursor();
   c.onsuccess=function(){var x=c.result;if(x){out[x.key]=x.value;x.continue()}else done(out)};c.onerror=function(){done()}}catch(e){done()}}}catch(e){done()}});
</script>

      <button class="tbtn ico" data-act="buddy-toggle" id="buddybtn" aria-pressed="false" title="Hide Pixel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4M9.5 12h.01M14.5 12h.01M9 15.5h6"/></svg><span class="lbl">Hide Pixel</span></button>
